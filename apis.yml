aid: acureon-pharmaceuticals
name: Acureon Pharmaceuticals
description: >-
  Acureon Pharmaceuticals, Inc. was a private United States biopharmaceutical company founded in 2006
  in the western suburbs of Philadelphia (Berwyn / Wayne, Pennsylvania), focused on specialty
  therapeutics intended to improve patient outcomes in the hospital areas of infectious disease,
  transplant and intensive care, by acquiring and commercializing novel and late-stage development
  drugs. It was backed by Domain Associates, New Enterprise Associates and Alta Partners. The company
  is defunct: it closed in 2008, filed nothing with the SEC after a single 2006 Form D (CIK
  0001365869), and its former domain acureonpharma.com was re-registered by an unrelated party in
  November 2022 and now serves an unrelated medical-loan content site. Acureon published no API,
  developer program, SDK or machine-readable specification while it operated, and there is no
  first-party surface left to profile.
